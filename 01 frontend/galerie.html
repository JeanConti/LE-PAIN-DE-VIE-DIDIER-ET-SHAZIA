<script src="public/css/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>

<script>
  // Script pour gérer le lightbox de la galerie
  document.addEventListener('DOMContentLoaded', function () {
    const galleryItems = document.querySelectorAll('.gallery-item');
    const modal = new bootstrap.Modal(document.getElementById('imageModal'));
    const modalImage = document.getElementById('modalImage');
    const prevBtn = document.getElementById('prevImage');
    const nextBtn = document.getElementById('nextImage');

    let currentImageIndex = 0;
    let images = [];

    // Collecter toutes les images sources
    galleryItems.forEach((item, index) => {
      const img = item.querySelector('img');
      images.push({
        src: img.src,
        alt: img.alt
      });

      // Ajouter un événement de clic sur chaque image
      item.addEventListener('click', function () {
        currentImageIndex = index;
        showImage(currentImageIndex);
        modal.show();
      });
    });

    // Fonction pour afficher l'image dans le modal
    function showImage(index) {
      modalImage.src = images[index].src;
      modalImage.alt = images[index].alt;
    }

    // Navigation vers l'image précédente
    prevBtn.addEventListener('click', function () {
      currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
      showImage(currentImageIndex);
    });

    // Navigation vers l'image suivante
    nextBtn.addEventListener('click', function () {
      currentImageIndex = (currentImageIndex + 1) % images.length;
      showImage(currentImageIndex);
    });

    // Navigation au clavier (flèches gauche/droite)
    document.addEventListener('keydown', function (e) {
      const modalElement = document.getElementById('imageModal');
      if (modalElement.classList.contains('show')) {
        if (e.key === 'ArrowLeft') {
          prevBtn.click();
        } else if (e.key === 'ArrowRight') {
          nextBtn.click();
        }
      }
    });
  });
</script>
